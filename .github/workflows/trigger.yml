name: Trigger Jataka Kamikaze Pods

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  trigger-jataka:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to Salesforce
        run: |
          AUTH_URL="${{ secrets.SFDX_AUTH_URL }}"
          if [ -z "$AUTH_URL" ]; then
            echo "::error::Missing SFDX_AUTH_URL secret. Set it to force://<clientId>:<clientSecret>:<refreshToken>@<instanceUrl>."
            exit 1
          fi
          if [[ "$AUTH_URL" != force://*:*:*@* ]]; then
            echo "::error::SFDX_AUTH_URL has invalid format. Expected force://<clientId>:<clientSecret>:<refreshToken>@<instanceUrl>."
            exit 1
          fi
          # Some auth URLs are copied with https:// in the instanceUrl; Salesforce CLI expects no protocol there.
          NORMALIZED_AUTH_URL="$(printf '%s' "$AUTH_URL" | sed -E 's#(force://[^:]+:[^:]*:[^@]+@)https?://#\1#')"
          printf '%s' "$NORMALIZED_AUTH_URL" > auth_url.txt
          sf org login sfdx-url --sfdx-url-file auth_url.txt --set-default --alias staging-org
          rm -f auth_url.txt

      - name: Deploy Source
        run: sf project deploy start --target-org staging-org --source-dir force-app --wait 10
        
      - name: Assign Permission Set
        run: |
          output=$(sf org assign permset -n Apex_Recipes --target-org staging-org 2>&1) && {
            echo "$output"
            exit 0
          }
          echo "$output"
          if echo "$output" | grep -q "Duplicate PermissionSetAssignment"; then
            echo "Permission set already assigned; continuing."
            exit 0
          fi
          exit 1

      - name: Trigger Jataka Kamikaze Pods
        run: |
          curl --fail-with-body --show-error -X POST "${{ secrets.JATAKA_API_URL }}/api/integrations/github/trigger" \
            -H "Authorization: Bearer ${{ secrets.JATAKA_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "installation_id": "${{ secrets.JATAKA_INSTALLATION_ID }}",
              "repo_full_name": "${{ github.repository }}",
              "branch": "${{ github.head_ref }}",
              "pr_number": "${{ github.event.pull_request.number }}"
            }'