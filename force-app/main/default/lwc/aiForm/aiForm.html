<template>
    <lightning-card title="AI Form Automation">
        <div class="slds-p-around_medium">
            <div class="slds-text-heading_medium slds-m-bottom_small">
                AI Form Automation System
            </div>
            
            <!-- Form Configuration Section -->
            <div class="slds-box slds-box_x-small slds-m-bottom_medium">
                <div class="slds-text-heading_small slds-m-bottom_small">
                    Form Configuration
                </div>
                
                <div class="slds-form-element">
                    <label class="slds-form-element__label">Form Description</label>
                    <div class="slds-form-element__control">
                        <lightning-textarea
                            placeholder="Describe the form you want to automate..."
                            value={formDescription}
                            onchange={handleFormDescriptionChange}>
                        </lightning-textarea>
                    </div>
                </div>

                <div class="slds-form-element slds-m-top_medium">
                    <label class="slds-form-element__label">Form Data (JSON)</label>
                    <div class="slds-form-element__control">
                        <lightning-textarea
                            placeholder="Enter JSON data (e.g., {&quot;firstName&quot;:&quot;John&quot;,&quot;lastName&quot;:&quot;Doe&quot;})"
                            value={formData}
                            onchange={handleFormDataChange}>
                        </lightning-textarea>
                    </div>
                </div>

                <div class="slds-form-element slds-m-top_medium">
                    <label class="slds-form-element__label">Workflow Name</label>
                    <div class="slds-form-element__control">
                        <lightning-input
                            type="text"
                            placeholder="My Workflow"
                            value={workflowName}
                            onchange={handleWorkflowNameChange}>
                        </lightning-input>
                    </div>
                </div>

                <div class="slds-m-top_medium">
                    <lightning-button
                        variant="brand"
                        label="Generate Steps"
                        onclick={handleGenerateSteps}
                        disabled="{!isValidGenerateInput}">
                    </lightning-button>
                    <lightning-button
                        variant="success"
                        label="Save Workflow"
                        onclick={handleSaveWorkflow}
                        disabled="{!isValidSaveInput}"
                        class="slds-m-left_small">
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Generate & Save"
                        onclick={handleExecuteAndSave}
                        disabled="{!isValidGenerateInput}"
                        class="slds-m-left_small">
                    </lightning-button>
                </div>
            </div>

            <!-- Generated Steps Section -->
            <div class="slds-box slds-box_x-small slds-m-bottom_medium" if:true={generatedsteps.length}>
                <div class="slds-text-heading_small slds-m-bottom_small">
                    Generated Steps (Including Save Step)
                </div>
                
                <template for:step in generatedsteps>
                    <div key={step.stepId} class="slds-box slds-box_x-small slds-m-bottom_x-small">
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_1-of-12">
                                <span class="slds-badge">{step.stepNumber}</span>
                            </div>
                            <div class="slds-col slds-size_2-of-12">
                                <span>{step.stepType}</span>
                            </div>
                            <div class="slds-col slds-size_3-of-12">
                                <span>{step.selector}</span>
                            </div>
                            <div class="slds-col slds-size_4-of-12">
                                <span>{step.value}</span>
                            </div>
                            <div class="slds-col slds-size_2-of-12">
                                <lightning-badge label="{step.stepType === 'click' && step.selector === '#saveButton' ? 'Save Action' : 'Regular Step'}" 
                                    variant="{step.stepType === 'click' && step.selector === '#saveButton' ? 'success' : 'neutral'}">
                                </lightning-badge>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Saved Workflows Section -->
            <div class="slds-box slds-box_x-small" if:true={savedworkflows.length}>
                <div class="slds-text-heading_small slds-m-bottom_small">
                    Saved Workflows
                </div>
                
                <template for:workflow in savedworkflows>
                    <div key={workflow.id} class="slds-box slds-box_x-small slds-m-bottom_x-small">
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_4-of-12">
                                <div class="slds-text-heading_small">{workflow.name}</div>
                                <div class="slds-text-body_small">{workflow.description}</div>
                            </div>
                            <div class="slds-col slds-size_3-of-12">
                                <div class="slds-text-body_small">Steps: {workflow.steps.length}</div>
                                <div class="slds-text-body_small">Created: {workflow.createdAt}</div>
                            </div>
                            <div class="slds-col slds-size_5-of-12">
                                <lightning-button
                                    variant="neutral"
                                    label="Load"
                                    size="small"
                                    onclick={handleLoadWorkflow}
                                    data-workflow-id={workflow.id}
                                    class="slds-m-right_x-small">
                                </lightning-button>
                                <lightning-button
                                    variant="destructive"
                                    label="Delete"
                                    size="small"
                                    onclick={handleDeleteWorkflow}
                                    data-workflow-id={workflow.id}>
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Empty State -->
            <div class="slds-text-align_center slds-p-around_large" if:false={savedworkflows.length}>
                <div class="slds-text-heading_small slds-text-color_weak">
                    No saved workflows yet. Generate and save your first workflow!
                </div>
            </div>
        </div>
    </lightning-card>
</template>
